name: Release

# A merge into main is a release: it builds the VSIX, tags v<version> and attaches the VSIX to a GitHub Release.
# The version comes from the files (docs/releasing.md); a version that already has a tag is not released twice.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version is consistent
        id: version
        shell: pwsh
        run: ./scripts/check-version.ps1 -GitHubOutput
      - name: Skip when this version is already released
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $exists = git tag -l $tag
          if ($exists) { "released=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8; Write-Host "$tag already exists: nothing to release. Bump the version to release again." }
          else { "released=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Build, test and package
        if: steps.tag.outputs.released == 'true'
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Release notes from the changelog
        if: steps.tag.outputs.released == 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))\b.*?(?=^## \d|\z)")
          $m.Value.Trim() | Set-Content release-notes.md -Encoding utf8
      - name: Tag and publish the GitHub Release
        if: steps.tag.outputs.released == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $preview = Select-String -Path src/DebugViaMcp.Vsix/source.extension.vsixmanifest -Pattern '<Preview>true</Preview>' -Quiet
          $args = @("v$v", "artifacts/DebugViaMcp-$v.vsix", 'artifacts/SHA256SUMS.txt', '--target', $env:GITHUB_SHA, '--title', "Debugging via MCP $v", '--notes-file', 'release-notes.md')
          if ($preview) { $args += '--prerelease' }
          gh release create @args
      - uses: actions/upload-artifact@v4
        if: steps.tag.outputs.released == 'true'
        with:
          name: DebugViaMcp-vsix
          path: artifacts/*

  # Marketplace upload. Off until the repository has the secret VS_MARKETPLACE_PAT; then it waits for the approval
  # of the "marketplace" environment (Settings → Environments) before it uploads.
  marketplace:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DebugViaMcp-vsix
          path: artifacts
      - name: Publish to the Visual Studio Marketplace
        shell: pwsh
        env:
          PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:PAT) { Write-Host 'VS_MARKETPLACE_PAT is not set: skipping the Marketplace upload.'; exit 0 }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -prerelease -products * -property installationPath
          $tool = Join-Path $vs 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          if (-not (Test-Path $tool)) { throw "VsixPublisher.exe not found at $tool" }
          & $tool publish -payload (Get-ChildItem artifacts\DebugViaMcp-*.vsix).FullName -publishManifest docs\marketplace\publishManifest.json -personalAccessToken $env:PAT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
